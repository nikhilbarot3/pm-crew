server {
    listen 8080;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # Proxy API calls to backend services
    # These are rewritten at runtime via NGINX env substitution or just use
    # the Vite build-time VITE_*_URL vars baked into the JS bundle.
}
